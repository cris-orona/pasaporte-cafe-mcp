name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked
      - name: Offline behavior tests (no provider credentials)
        run: cargo test --locked
