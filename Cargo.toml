[package]
name = "pasaporte-cafe-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for the Pasaporte del Cafe de Especialidad app (CDMX specialty coffee passport)"
license = "MIT"

[[bin]]
name = "pasaporte-cafe-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
